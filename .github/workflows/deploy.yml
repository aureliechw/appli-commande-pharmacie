name: Mise à jour ANSM et publication

on:
  push:
    branches: [main]
  schedule:
    # Heures UTC : 19 h = 21 h à Paris en été, 20 h = 21 h en hiver.
    # Le job « horaire » ne garde que le déclenchement qui tombe à 21 h à Paris.
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  horaire:
    runs-on: ubuntu-latest
    outputs:
      publier: ${{ steps.verif.outputs.publier }}
    steps:
      - id: verif
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          publier=true
          decalage=$(TZ=Europe/Paris date +%z)
          if { [ "$CRON" = "0 19 * * *" ] && [ "$decalage" != "+0200" ]; } ||
             { [ "$CRON" = "0 20 * * *" ] && [ "$decalage" != "+0100" ]; }; then
            publier=false
          fi
          echo "publier=$publier" >> "$GITHUB_OUTPUT"

  publier:
    needs: horaire
    if: needs.horaire.outputs.publier == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Télécharger l'export ANSM
        env:
          URL_ANSM: https://ansm.sante.fr/disponibilites-des-produits-de-sante/medicaments/export
          URL_SITE: ${{ steps.pages.outputs.base_url }}
        run: bash outils/telecharger-ansm.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploiement
        uses: actions/deploy-pages@v4
